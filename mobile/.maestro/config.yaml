# Maestro CLI workspace config — Sangha Association mobile
# Run: `maestro test .maestro/` (full suite) or `maestro test .maestro/auth.yaml`
# Required env: MAESTRO_TEST_PASSWORD (mot de passe Supabase du compte de test)
flows:
  - auth.yaml
  - onboarding.yaml
  - navigation.yaml
  - chat.yaml
  - settings.yaml
  - wallet.yaml
  - referral.yaml
  - pricing.yaml
  - responsive.yaml
  - error.yaml

executionOrder:
  continueOnFailure: true
